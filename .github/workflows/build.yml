name: Build Jarvis

on:
  push:
    branches: [main]
    paths-ignore: ["config/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Get the free "Hey Jarvis" wake-word models (openWakeWord)
        run: |
          set -e
          A=app/src/main/assets
          B=https://github.com/dscripka/openWakeWord/releases/download/v0.5.1
          curl -fsSLo $A/melspectrogram.onnx $B/melspectrogram.onnx
          curl -fsSLo $A/embedding_model.onnx $B/embedding_model.onnx
          curl -fsSLo $A/hey_jarvis.onnx $B/hey_jarvis_v0.1.onnx

      - name: Voice engine (sherpa-onnx, renamed so it doesn't clash with the wake-word engine)
        run: |
          sudo apt-get install -y patchelf > /dev/null
          V=v1.13.8
          curl -fsSL -o /tmp/s.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/$V/sherpa-onnx-$V-android.tar.bz2
          mkdir -p /tmp/s && tar xjf /tmp/s.tar.bz2 -C /tmp/s
          D=app/src/main/jniLibs/arm64-v8a; mkdir -p $D
          cp /tmp/s/jniLibs/arm64-v8a/libonnxruntime.so $D/libonnxruntime_sherpa.so
          cp /tmp/s/jniLibs/arm64-v8a/libsherpa-onnx-jni.so $D/
          patchelf --set-soname libonnxruntime_sherpa.so $D/libonnxruntime_sherpa.so
          patchelf --replace-needed libonnxruntime.so libonnxruntime_sherpa.so $D/libsherpa-onnx-jni.so
          readelf -d $D/libsherpa-onnx-jni.so | grep NEEDED
          readelf -d $D/libonnxruntime_sherpa.so | grep SONAME
          ls -la $A

      - name: Build the app
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk jarvis-${{ github.run_number }}.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          body: Install this on your phone to update Jarvis. Your keys and settings stay.
          files: jarvis-${{ github.run_number }}.apk
          make_latest: true
